name: CI

# Cada cambio en main (y cada PR) compila y prueba todo:
#  - backend: mvn verify con Postgres 16 real (Testcontainers)
#  - frontend: pruebas unitarias (Vitest), build y pruebas de punta a punta (Playwright)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y probar
        run: mvn -B -ntp verify
      - name: Guardar reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire
          path: backend/target/surefire-reports

  frontend:
    name: Frontend (unitarias + build + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Pruebas unitarias
        run: npm test
      - name: Build (TypeScript + PWA)
        run: npm run build
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Pruebas de punta a punta
        run: npm run e2e -- --trace off
      - name: Guardar reporte e2e
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
