name: CI

# Cada cambio en main (y cada PR) compila y prueba todo:
#  - backend: mvn verify con Postgres 16 real (Testcontainers)
#  - frontend: pruebas unitarias (Vitest), build y pruebas de punta a punta (Playwright)
#  - e2e-real: la PWA contra el backend de verdad (Postgres real, sin API simulada)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y probar
        run: mvn -B -ntp verify
      - name: Guardar reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire
          path: backend/target/surefire-reports

  frontend:
    name: Frontend (unitarias + build + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Pruebas unitarias
        run: npm test
      - name: Build (TypeScript + PWA)
        run: npm run build
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Pruebas de punta a punta
        run: npm run e2e -- --trace off
      - name: Guardar reporte e2e
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  e2e-real:
    name: E2E contra el servidor real
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kioskpos_admin
          POSTGRES_PASSWORD: kioskpos_admin_dev
          POSTGRES_DB: kioskpos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kioskpos_admin -d kioskpos"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KIOSKPOS_BOOTSTRAP_SUPERADMINEMAIL: admin@e2e.local
      KIOSKPOS_BOOTSTRAP_SUPERADMINPASSWORD: clave-admin-e2e-123
      KP_ADMIN_EMAIL: admin@e2e.local
      KP_ADMIN_PASSWORD: clave-admin-e2e-123
      KP_API: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar backend
        working-directory: backend
        run: mvn -B -ntp -DskipTests package
      - name: Arrancar backend
        working-directory: backend
        run: |
          nohup java -jar "$(ls target/*.jar | head -1)" > ../backend.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/actuator/health > /dev/null; then echo "Backend listo"; exit 0; fi
            sleep 2
          done
          echo "El backend no arrancó"; tail -100 ../backend.log; exit 1
      - name: Instalar y construir la PWA
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Pruebas contra el servidor real
        working-directory: frontend
        run: npm run e2e:real -- --trace off
      - name: Guardar log del backend y reporte
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-real
          path: |
            backend.log
            frontend/playwright-report-real
