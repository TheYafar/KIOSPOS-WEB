spring:
  application:
    name: kioskpos-web-backend

  # Datasource de RUNTIME: lo usa Hibernate/JPA para servir requests.
  # Se conecta como kioskpos_app (sin privilegios de superusuario/propietario),
  # creado por db/init/01-create-app-role.sql — así Row Level Security no se
  # puede saltar desde este pool.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kioskpos}
    username: ${DB_APP_USER:kioskpos_app}
    password: ${DB_APP_PASSWORD:kioskpos_app_dev}
    hikari:
      pool-name: kioskpos-app-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC

  # Datasource de MIGRACIÓN: Flyway corre con credenciales administrativas
  # (dueño de las tablas), separadas del pool de runtime de arriba.
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kioskpos}
    user: ${DB_ADMIN_USER:kioskpos_admin}
    password: ${DB_ADMIN_PASSWORD:kioskpos_admin_dev}
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
