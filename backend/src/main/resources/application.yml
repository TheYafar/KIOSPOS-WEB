# El puerto HTTP. En local/Docker es 8080; en la nube (Render) se toma de $PORT.
server:
  port: ${PORT:8080}

spring:
  application:
    name: kioskpos-web-backend

  # Arranque perezoso: los beans se crean al primer uso, así el servidor abre el
  # puerto mucho antes (clave en instancias lentas como Render free / VPS 1GB).
  main:
    lazy-initialization: true

  # Datasource de RUNTIME: lo usa Hibernate/JPA para servir requests.
  # Se conecta como kioskpos_app (sin privilegios de superusuario/propietario),
  # creado por db/init/01-create-app-role.sql — así Row Level Security no se
  # puede saltar desde este pool.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kioskpos}
    username: ${DB_APP_USER:kioskpos_app}
    password: ${DB_APP_PASSWORD:kioskpos_app_dev}
    hikari:
      pool-name: kioskpos-app-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC

  # Datasource de MIGRACIÓN: Flyway corre con credenciales administrativas
  # (dueño de las tablas), separadas del pool de runtime de arriba.
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kioskpos}
    user: ${DB_ADMIN_USER:kioskpos_admin}
    password: ${DB_ADMIN_PASSWORD:kioskpos_admin_dev}
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Correo transaccional por SMTP. Con Resend: host smtp.resend.com, user "resend",
  # pass = tu API key de Resend. Agnóstico del proveedor (cambias estas variables y
  # funciona con Brevo, SES, etc.). Si no se configura, EmailService no envía (no rompe).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:resend}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

kioskpos:
  # Bloqueo por intentos fallidos (PIN, clave del dueño, super admin).
  login:
    max-intentos: ${KIOSKPOS_LOGIN_MAX_INTENTOS:5}
    bloqueo-minutos: ${KIOSKPOS_LOGIN_BLOQUEO_MINUTOS:15}
  jwt:
    # En dev hay un secreto por defecto; en producción SIEMPRE via variable de entorno
    # KIOSKPOS_JWT_SECRET (>= 32 bytes). Firmar los tokens: el servidor es la autoridad.
    secret: ${KIOSKPOS_JWT_SECRET:dev-secret-cambiar-en-produccion-min-32-bytes!!}
    # Rotación: la clave VIEJA aquí unas horas (se acepta, no se firma con ella). Ver DESPLIEGUE.md.
    secret-anterior: ${KIOSKPOS_JWT_SECRET_ANTERIOR:}
    ttl-minutes: ${KIOSKPOS_JWT_TTL_MINUTES:720}
  mail:
    # El correo solo se envía si enabled=true Y hay MAIL_HOST configurado.
    enabled: ${MAIL_ENABLED:false}
    # Remitente. Antes de verificar tu dominio en Resend puedes usar onboarding@resend.dev.
    from: ${MAIL_FROM:KioskPOS <onboarding@resend.dev>}
    # URL pública de la app, para los enlaces de los correos.
    app-url: ${MAIL_APP_URL:https://app.kioskpos.app}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # El health check de correo prueba el SMTP, que Render bloquea → el chequeo se
    # colgaba ~134s y daba DOWN, y Render marcaba el servicio caído. Se apaga (no
    # afecta el envío real de correos).
    mail:
      enabled: false
