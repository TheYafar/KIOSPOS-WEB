server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # La API va al backend (servicio "backend" en la red de docker-compose).
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Salud del backend para el monitoreo (UptimeRobot, ops/monitor.sh). Solo esta ruta de /actuator.
  location = /actuator/health {
    proxy_pass http://backend:8080;
  }

  # PWA: el service worker no se cachea para que siempre tome la última versión.
  location = /sw.js { add_header Cache-Control "no-cache"; }

  # SPA: cualquier ruta cae en index.html.
  location / {
    try_files $uri /index.html;
  }
}
