# Producción: Postgres + backend (Spring Boot) + frontend (nginx que sirve la PWA
# y hace de proxy a /api). Variables en un archivo .env (ver .env.example).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-kioskpos_admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?define DB_ADMIN_PASSWORD en .env}
      POSTGRES_DB: ${DB_NAME:-kioskpos}
      # Clave real del rol de runtime (la aplica db/init/02-app-password.sh al crear la BD).
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-kioskpos_app_dev}
    volumes:
      - kioskpos_pgdata:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-kioskpos_admin} -d ${DB_NAME:-kioskpos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-kioskpos}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-kioskpos_admin}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD}
      DB_APP_USER: ${DB_APP_USER:-kioskpos_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-kioskpos_app_dev}
      KIOSKPOS_JWT_SECRET: ${KIOSKPOS_JWT_SECRET:?define un secreto de 32+ bytes en .env}
      # Solo durante una rotación de la clave JWT (ver SEGURIDAD.md); si no, vacío.
      KIOSKPOS_JWT_SECRET_ANTERIOR: ${KIOSKPOS_JWT_SECRET_ANTERIOR:-}
      KIOSKPOS_LOGIN_MAX_INTENTOS: ${KIOSKPOS_LOGIN_MAX_INTENTOS:-5}
      KIOSKPOS_LOGIN_BLOQUEO_MINUTOS: ${KIOSKPOS_LOGIN_BLOQUEO_MINUTOS:-15}
      KIOSKPOS_BOOTSTRAP_SUPERADMINEMAIL: ${KIOSKPOS_BOOTSTRAP_SUPERADMINEMAIL:-}
      KIOSKPOS_BOOTSTRAP_SUPERADMINPASSWORD: ${KIOSKPOS_BOOTSTRAP_SUPERADMINPASSWORD:-}
      # Correo transaccional (Resend por SMTP). Déjalo vacío/false para no enviar.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-resend}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-KioskPOS <onboarding@resend.dev>}
      MAIL_APP_URL: ${MAIL_APP_URL:-https://app.kioskpos.app}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Sin puerto público: Caddy (abajo) es la entrada y lo alcanza como frontend:80.

  # Proxy con HTTPS automático (Let's Encrypt). Pon tu dominio en DOMAIN (.env).
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      DOMAIN: ${DOMAIN:-kiospos.duckdns.org}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  kioskpos_pgdata:
  caddy_data:
  caddy_config:
