services:
  postgres:
    image: postgres:16
    container_name: kioskpos_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-kioskpos_admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-kioskpos_admin_dev}
      POSTGRES_DB: ${DB_NAME:-kioskpos}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - kioskpos_pgdata:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-kioskpos_admin} -d ${DB_NAME:-kioskpos}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kioskpos_pgdata:
